<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <title>Dispatch HPE</title>
    <!-- Contenu original conservé, uniquement raccourci ici pour l'exemple -->
    <style>
        /* ... tout ton CSS existant ici ... */

        /* ============================================================
           UI/UX Refresh - Dispatch HPE
           À placer à la fin du <style> principal pour surcharger proprement
           ============================================================ */
        :root {
            --ux-blue:#2563eb;
            --ux-blue-soft:#dbeafe;
            --ux-green:#16a34a;
            --ux-orange:#f59e0b;
            --ux-red:#dc2626;
            --ux-surface:#ffffff;
            --ux-surface-2:#f8fafc;
            --ux-border:#e2e8f0;
            --ux-text:#0f172a;
            --ux-muted:#64748b;
            --ux-radius:12px;
            --ux-shadow:0 10px 30px rgba(15,23,42,.08);
        }
        html.dark {
            --ux-surface:#0f172a;
            --ux-surface-2:#111827;
            --ux-border:#334155;
            --ux-text:#f8fafc;
            --ux-muted:#94a3b8;
            --ux-shadow:0 10px 30px rgba(0,0,0,.35);
        }
        .ux-card,
        .k-col,
        .panel,
        .modal {
            border:1px solid var(--ux-border);
            background:var(--ux-surface);
            border-radius:var(--ux-radius);
            box-shadow:var(--ux-shadow);
        }
        .btn {
            border-radius:999px;
            border:1px solid var(--ux-border);
            background:linear-gradient(180deg, #fff, var(--ux-surface-2));
            color:var(--ux-text);
            font-weight:600;
            transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
        }
        .btn:hover { transform:translateY(-1px); box-shadow:0 6px 18px rgba(15,23,42,.12); }
        .btn-primary { background:var(--ux-blue); color:#fff; border-color:var(--ux-blue); }
        .ux-toolbar {
            display:flex; align-items:center; justify-content:space-between;
            gap:10px; flex-wrap:wrap; padding:8px 10px;
            background:var(--ux-surface-2); border:1px solid var(--ux-border);
            border-radius:var(--ux-radius); margin:8px 0;
        }
        .ux-chip-row { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
        .ux-chip {
            height:26px; padding:0 11px; border-radius:999px;
            font-size:11px; font-weight:700; cursor:pointer;
            border:1px solid var(--ux-border); background:var(--ux-surface);
            color:var(--ux-muted); transition:all .15s ease;
        }
        .ux-chip:hover { border-color:var(--ux-blue); color:var(--ux-blue); }
        .ux-chip.active { background:var(--ux-blue-soft); border-color:var(--ux-blue); color:var(--ux-blue); }
        .sync-pill {
            display:inline-flex; align-items:center; gap:7px; height:28px;
            padding:0 10px; border-radius:999px; border:1px solid var(--ux-border);
            background:var(--ux-surface-2); font-size:11px; font-weight:700; color:var(--ux-muted);
        }
        .sync-dot { width:8px; height:8px; border-radius:50%; background:var(--ux-muted); }
        .sync-ok .sync-dot { background:var(--ux-green); }
        .sync-pending .sync-dot { background:var(--ux-orange); animation:uxPulse 1.2s infinite; }
        .sync-error .sync-dot { background:var(--ux-red); }
        @keyframes uxPulse { 50% { opacity:.35; } }
        .k-progress { height:4px; background:var(--ux-border); border-radius:999px; margin-top:7px; overflow:hidden; }
        .k-progress-bar { height:100%; border-radius:999px; transition:width .25s ease; }
        #master-table tbody tr:hover { background:rgba(37,99,235,.06); }
        #master-table th { position:sticky; top:0; z-index:5; background:var(--ux-surface-2); }
    </style>
</head>
<body>
    <!-- Ici, ton HTML original complet de Dispatch, non modifié au niveau fonctionnel -->

    <header id="header-top">
        <!-- Ton contenu header existant -->
        <div class="sync-pill sync-ok" id="sync-pill">
            <span class="sync-dot"></span>
            <span id="sync-label">Sync OK</span>
        </div>
        <button class="btn btn-primary" id="btn-mon-desk">Mon Desk</button>
    </header>

    <div class="ux-toolbar" id="dispatch-quick-filters">
        <div class="ux-chip-row">
            <button class="ux-chip" data-filter="all">Tous</button>
            <button class="ux-chip" data-filter="pending">En attente</button>
            <button class="ux-chip" data-filter="today">Aujourd'hui</button>
            <button class="ux-chip" data-filter="late">En retard</button>
        </div>
    </div>

    <!-- Table Dispatch existante -->
    <table id="master-table">
        <!-- ton tbody/tr existant -->
    </table>

    <!-- Kanban existant, avec une progress bar injectée dans les cartes -->
    <div class="k-card">
        <!-- contenu carte existante -->
        <div class="k-progress">
            <div class="k-progress-bar" style="width:40%; background:var(--ux-blue);"></div>
        </div>
    </div>

    <script>
        // ... tout ton JS existant ici ...

        function applyQuickFilter(rows) {
            const activeChip = document.querySelector('.ux-chip.active');
            if (!activeChip) return rows;
            const filter = activeChip.dataset.filter;
            // Exemple d'implémentation : à adapter à tes colonnes/statuts
            if (filter === 'all') return rows;
            if (filter === 'pending') return rows.filter(r => r.status === 'PENDING');
            if (filter === 'today') return rows.filter(r => r.date === new Date().toLocaleDateString('fr-FR'));
            if (filter === 'late') return rows.filter(r => r.isLate);
            return rows;
        }

        function initQuickFilters() {
            const chips = document.querySelectorAll('.ux-chip');
            chips.forEach(chip => {
                chip.addEventListener('click', () => {
                    chips.forEach(c => c.classList.remove('active'));
                    chip.classList.add('active');
                    // Tu peux ici relancer renderMaster() pour appliquer le filtre
                    if (typeof renderMaster === 'function') {
                        renderMaster();
                    }
                });
            });
        }

        document.addEventListener('DOMContentLoaded', initQuickFilters);
    </script>
</body>
</html>
