</head>
<body>
<div id="app">

<!-- ══ HEADER ══ -->
<div id="header">
  <div id="header-top">
    <div class="logo">
      <div class="logo-dot"></div>
      Dispatch HPE
    </div>
    <div class="header-sep"></div>
    <div class="stat-pill sp-total">
      <span>Total</span><span class="sp-val" id="st-total">0</span>
    </div>
    <div class="stat-pill sp-cc">
      <span>CC</span><span class="sp-val" id="st-cc">0</span>
    </div>
    <div class="stat-pill sp-fc">
      <span>FC</span><span class="sp-val" id="st-fc">0</span>
    </div>
    <div class="stat-pill sp-nto">
      <span>NTO</span><span class="sp-val" id="st-nto">0</span>
    </div>
    <div class="header-spacer"></div>
    <input class="inp-search" id="inp-search" type="text" placeholder="Rechercher · Ctrl+F">
    <div class="header-sep"></div>
    <button class="btn btn-primary" id="btn-import">📥 Importer Excel</button>
    <input type="file" id="file-input" accept=".xlsx,.xls,.csv" style="display:none">
    <button class="btn btn-ghost" id="btn-load-json">📂 Charger sauvegarde</button>
    <input type="file" id="json-input" accept=".json" style="display:none">
    <button class="btn btn-blue-out" id="btn-save">💾 Sauvegarder</button>
    <button class="btn btn-green-out btn-sm" id="btn-export-excel" title="Exporter le tableau Dispatch en Excel (.xlsx)">📊 Export Excel</button>
    <div class="header-sep"></div>
    <button class="btn btn-ghost btn-sm" id="btn-export-wf" title="Exporter les dossiers en cours (workflow) pour les ré-importer plus tard ou les transmettre">📤 Workflow</button>
    <button class="btn btn-ghost btn-sm" id="btn-import-wf" title="Importer un workflow exporté précédemment">📥 Workflow</button>
    <input type="file" id="wf-input" accept=".json" style="display:none">
    <div class="header-sep"></div>
    <button class="btn btn-purple-out btn-sm" onclick="reseauForceSave()" title="Sauvegarder sur le réseau partagé">⬆ Réseau</button>
    <button class="btn btn-purple-out btn-sm" onclick="reseauForceLoad()" title="Recharger depuis le réseau partagé">⬇ Réseau</button>
    <div class="header-sep"></div>
    <button class="btn btn-ghost btn-sm" onclick="toggleDarkMode()" title="Basculer mode sombre (Ctrl+D)">🌓</button>
  </div>

  <div id="header-actions">
    <span style="font-size:10px;font-weight:600;color:var(--text3);letter-spacing:.5px;margin-right:4px">E.TMS</span>
    <!-- Champ N° dossier rapide pour les boutons du header -->
    <input id="hdr-file" type="text" placeholder="N° dossier J…"
      style="width:130px;height:26px;border:1px solid var(--border2);background:var(--surface2);
             color:var(--text);font-family:var(--mono);font-size:11px;padding:0 8px;
             border-radius:4px;outline:none;transition:border-color .15s;"
      onfocus="this.style.borderColor='var(--blue)'"
      onblur="this.style.borderColor='var(--border2)'"
      onkeydown="if(event.key==='Enter'){ document.getElementById('hdr-btn-log').click(); }"
      title="Saisir le N° de dossier puis cliquer sur un bouton E.TMS">
    <div class="etms-sep"></div>
    <button class="etms-btn" onclick="sendActionHeader('ETMS_CMD','EDOC')">EDOC</button>
    <button class="etms-btn" id="hdr-btn-log" onclick="sendActionHeader('ETMS_CMD','LOG')">LOG</button>
    <button class="etms-btn" onclick="sendActionHeader('ETMS_CMD','DIMS')">DIMS</button>
    <button class="etms-btn" onclick="sendActionHeader('ETMS_CMD','NOTES')">NOTES</button>
    <button class="etms-btn" onclick="sendActionHeader('ETMS_CMD','HIST')">HIST</button>
    <button class="etms-btn" onclick="sendActionHeader('ETMS_CMD','REFS')">REFS</button>
    <!-- F8 volontairement retiré des actions rapides : réservé à l’usage ETMS après LOG + J -->
    <button class="etms-btn warn" onclick="sendActionHeader('ETMS_CMD','LOG X')">LOG X</button>
    <div class="etms-sep"></div>
    <button class="etms-btn" style="color:var(--teal)" onclick="sendActionHeader('MAIL_RDV','')">Mails HPE</button>
    <div class="etms-sep"></div>
    <div style="display:flex;align-items:center;gap:5px">
      <span style="font-size:10px;font-weight:600;color:var(--text3)">👤</span>
      <select id="operator-filter" onchange="applyOperatorFilter()"
        style="height:26px;border:1px solid var(--border2);border-radius:4px;background:var(--surface2);color:var(--text);font-size:11px;padding:0 6px;min-width:110px">
        <option value="">Tous</option>
      </select>
    </div>
    <button class="btn btn-success btn-sm" id="btn-add-manual">➕ Dossier manuel</button>
    <button class="btn btn-blue-out btn-sm" id="btn-add-group" onclick="openGroupManual()">🔗 Groupe manuel</button>
    <button class="btn btn-ghost btn-sm" style="color:var(--orange)" onclick="checkMissingPDF()">📋 PDF manquants</button>
    <button class="btn btn-ghost btn-sm" id="btn-clear-done" style="color:var(--red)">🗑 Vider terminés</button>
    <button class="btn btn-ghost btn-sm" style="color:var(--teal)" onclick="refreshData(false)" title="Rafraîchir les données depuis le serveur">🔄 Sync</button>
  </div>
</div>
