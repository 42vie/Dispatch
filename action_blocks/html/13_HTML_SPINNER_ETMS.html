<!-- ══ SPINNER OVERLAY ETMS ══ -->
<div id="etms-spinner" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.35);z-index:9999;
  display:none;align-items:center;justify-content:center">
  <div style="background:var(--surface);border-radius:12px;padding:28px 40px;box-shadow:var(--shadow-lg);text-align:center;min-width:280px">
    <div id="etms-spinner-icon" style="font-size:28px;margin-bottom:10px;animation:spin 1.2s linear infinite">&#9881;</div>
    <div id="etms-spinner-msg" style="font-size:14px;font-weight:600;color:var(--text)">Action en cours...</div>
    <div id="etms-spinner-sub" style="font-size:11px;color:var(--text3);margin-top:6px">Ne touchez pas à E.TMS pendant l'exécution</div>
  </div>
</div>
